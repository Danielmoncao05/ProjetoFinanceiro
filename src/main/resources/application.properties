spring.application.name=ProjetoFinanceiro

# h2 config
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.datasource.url=jdbc:h2:mem:gestao
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sword
spring.datasource.password=12345
 # formatação de banco padrao em h2 e n em sql
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Login user definition spring security

spring.security.user.name=pop
spring.security.user.password=101020


# desabilitar auto seguranca
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
